[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
config = "0.15.27"
dotenvy = "0.15.7"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
sqlx = { version = "0.9.0", features = ["tls-rustls", "macros", "postgres", "uuid", "chrono", "migrate", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.25"
tracing-bunyan-formatter = "0.3.11"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
# Downgraded to keep it aligned with the 2020 book
validator = "0.16"

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "rustls"]

[dev-dependencies]
claims = "0.8.0"
# Downgraded to keep it aligned with the 2020 book
fake = "~2.3"
# Downgraded to keep it aligned with the 2020 book
quickcheck = "0.9.2"
# Downgraded to keep it aligned with the 2020 book
quickcheck_macros = "0.9.1"
serde_json = "1.0.154"
wiremock = "0.6.5"
