[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["tls-rustls", "macros", "postgres", "uuid", "chrono", "migrate", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.25"
tracing-bunyan-formatter = "0.3.11"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
reqwest = "0.13.5"
