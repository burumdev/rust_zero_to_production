services:
  db:
    image: postgres:15-alpine
    container_name: zero2prod_docker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newsletter
    ports:
      - "5432:5432"

  app:
      build: .
      container_name: zero2prod_docker_app
      ports:
        - "8000:8000"
      env_file:
            - .env
      environment:
        - APP_ENVIRONMENT=production
        - APP_DATABASE__USERNAME=postgres
        - APP_DATABASE__PASSWORD=password
      depends_on:
        - db

networks:
  default:
    name: app-network
