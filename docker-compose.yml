services:
  db:
    image: postgres:15-alpine
    container_name: zero2prod_docker_db
    environment:
      - POSTGRES_USER=${APP_DATABASE__USERNAME}
      - POSTGRES_PASSWORD=${APP_DATABASE__PASSWORD}
      - POSTGRES_DB=${APP_DATABASE__DATABASE_NAME}
    # Not necessary in app testing environment
    # I prefer the database gets destroyed and reseeded
    # every reset.
    #volumes:
      #- pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
      build: .
      container_name: zero2prod_docker_app
      ports:
        - "8000:8000"
      env_file:
            - .env
      environment:
        - APP_ENVIRONMENT=production
        - APP_DATABASE__USERNAME=${APP_DATABASE__USERNAME}
        - APP_DATABASE__PASSWORD=${APP_DATABASE__PASSWORD}
        - APP_DATABASE__HOST=db

networks:
  default:
    name: app-network
